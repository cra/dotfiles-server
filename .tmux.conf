set-option escape-time 0
set -g default-terminal "xterm-kitty"
set -ag terminal-overrides ",xterm-kitty:Tc"
set -g mouse on

bind -n M-d select-pane -L
bind -n M-h select-pane -D
bind -n M-t select-pane -U
bind -n M-n select-pane -R

bind -n M-D resize-pane -L 5
bind -n M-H resize-pane -D 5
bind -n M-T resize-pane -U 5
bind -n M-N resize-pane -R 5


bind % split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# Using symbols from DVP top row (unshifted: $&[{}(=*)+]!)
bind -n M-$ select-window -t 0
bind -n M-& select-window -t 1
bind -n M-[ select-window -t 2
bind -n M-{ select-window -t 3
bind -n M-\} select-window -t 4
bind -n M-( select-window -t 5

# # Or just use home row letters
# bind -n M-a select-window -t 1
# bind -n M-o select-window -t 2
# bind -n M-e select-window -t 3
# bind -n M-u select-window -t 4
# bind -n M-i select-window -t 5

# Sync panes toggle (type in all panes at once)
bind S setw synchronize-panes

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"


# Last window toggle
bind -n M-Tab last-window

# swap panes
bind > swap-pane -D
bind < swap-pane -U

#  Workflow:
# 1. prefix + [ → enter copy mode
# 2. Navigate with your vi keys (hjkl / dvorak equivalent)
# 3. v → start selecting text
# 4. Move to expand selection
# 5. y → yank (copies to tmux buffer, and with Kitty integration, to system clipboard)
# 6. prefix + ] → paste
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel


# Flash pane numbers on demand (prefix + q by default, but make it linger)
set -g display-panes-time 3000  # 3 seconds
set -g display-panes-colour colour238
set -g display-panes-active-colour colour226

# normal subtle borders
set -g pane-active-border-style 'fg=colour240'
set -g pane-border-style 'fg=colour236'

bind -n M-z resize-pane -Z

# dim inactive/highlight active -- need to adjust colors
# set -g window-style 'bg=colour235'
# set -g window-active-style 'bg=colour0'

bind T {
	# Make active pane border very visible
	set -g pane-active-border-style 'fg=colour214'
	set -g pane-border-style 'fg=colour236'
	set -g window-style 'bg=colour233'
	set -g window-active-style 'bg=default'
	display "Teachink mode ON"
}

bind t {
	set -g pane-active-border-style 'fg=colour240'
	set -g pane-border-style 'fg=colour236'
	set -g window-style 'bg=default'
	set -g window-active-style 'bg=default'
	display "Teachink mode OFF"
}

bind B select-pane -P 'bg=teal'
bind b select-pane -P 'bg=default'


bind A setw monitor-activity on \; display "Monitoring activity"
bind a setw monitor-activity off \; display "Activity monitoring off"
bind V setw monitor-silence 30 \; display "Alert if silent for 30s"
bind v setw monitor-silence 0 \; display "Silence monitoring off"


# === Nord status bar ===
# Nord palette:
#   bg: #2E3440(nord0) #3B4252(nord1) #434C5F(nord2) #4C566A(nord3)
#   fg: #D8DEE9(nord4) #E5E9F0(nord5) #ECEFF4(nord6)
#   teal: #8FBCBB(nord7)  lt-blue: #88C0D0(nord8)  blue: #81A1C1(nord9)
#   red: #BF616A(nord11) yellow: #EBCB8B(nord13) green: #A3BE8C(nord14)

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#3B4252,fg=#D8DEE9"
set -g message-style "bg=#3B4252,fg=#EBCB8B"
set -g message-command-style "bg=#3B4252,fg=#EBCB8B"

# Window tabs
setw -g window-status-format "#[fg=#D8DEE9] #I:#W "
setw -g window-status-current-format "#[fg=#2E3440,bg=#81A1C1,bold] #I:#W "
setw -g window-status-separator ""

# Left: session name
set -g status-left "#[fg=#2E3440,bg=#A3BE8C,bold] #S #[default] "
set -g status-left-length 20
set -g status-right-length 60

# Right: date + time
set -g status-right "#[fg=#A3BE8C]%a %d %b #[fg=#4C566A]│ #[fg=#88C0D0]%H:%M "
